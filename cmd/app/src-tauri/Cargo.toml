[package]
name = "gams"
version = "2.0.4"
description = "Game Assets Management System"
authors = ["Kazys Kalabibishkis"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "gams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-macos-fps = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "44", features = ["component-model", "async"] }
wasmtime-wasi = "44"
wasmtime-wasi-http = "44"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSOpenPanel"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

[dev-dependencies]
tempfile = "3"
