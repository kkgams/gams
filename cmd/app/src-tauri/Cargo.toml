[package]
name = "gams"
version = "2.2.0"
description = "Game Assets Management System"
authors = ["Kazys Kalabibishkis"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "gams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "44", features = ["component-model", "async"] }
wasmtime-wasi = "44"
wasmtime-wasi-http = "44"
tokio = { version = "1", features = ["net", "rt-multi-thread", "signal", "io-util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "=0.10.9"
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-fps = "0.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSOpenPanel"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"
