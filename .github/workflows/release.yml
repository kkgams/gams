name: Publish desktop Host release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: host-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            archive: GAMS-macos-aarch64.zip
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: GAMS-windows-x86_64.zip
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: GAMS-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        if: runner.os == 'macOS'
      # Release ELF binaries must link system GTK/WebKit, not /nix/store.
      # Developer/test shells still use the repository's pinned Nix flake.
      - name: Install Linux native release dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      # Nix has no native Windows support; use the runner's MSVC/Windows SDK.
      - name: Activate native Windows toolchain and GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make --no-progress -y
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'MSVC installation not found' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }
      - name: Install pinned native Rust and packaging tools
        if: runner.os != 'macOS'
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target "$TARGET"
          rustup default 1.94.1
          cargo install tauri-cli --version 2.11.0 --locked
          cargo install cargo-about --version 0.8.4 --locked
      - name: Package native macOS Host
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" nix develop --command make package
      - name: Package native Windows Host with Git Bash recipes
        if: runner.os == 'Windows'
        run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" make package SHELL="$(cygpath -m "$(command -v bash)")"
      - name: Package native Linux Host
        if: runner.os == 'Linux'
        run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" make package
      - name: Upload platform release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: host-${{ matrix.platform }}
          path: |
            build.nosync/${{ matrix.archive }}
            build.nosync/SHA256SUMS-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: host-*
          merge-multiple: true
          path: build.nosync
      - name: Publish all native packages once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            build.nosync/GAMS-macos-aarch64.zip \
            build.nosync/SHA256SUMS-macos-aarch64 \
            build.nosync/GAMS-windows-x86_64.zip \
            build.nosync/SHA256SUMS-windows-x86_64 \
            build.nosync/GAMS-linux-x86_64.tar.gz \
            build.nosync/SHA256SUMS-linux-x86_64
