name: Verify desktop Host

on:
  pull_request:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Test Host and validate documentation
        run: nix develop --command make test game-icons-check validate-docs
