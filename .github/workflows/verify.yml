name: Verify desktop Host

on:
  pull_request:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup-native
        with:
          target: ${{ matrix.target }}
      # Optimized test dependencies also warm the next tag's native build cache.
      # These are test binaries, not release executables, bundles or archives.
      - name: Test Host and validate documentation
        if: runner.os == 'macOS'
        run: nix develop --command make test game-icons-check validate-docs RUST_TEST_ARGS="--release --target $TARGET"
      - name: Test native Windows Rust Host
        if: runner.os == 'Windows'
        run: make test-rust RUST_TEST_ARGS="--release --target $TARGET" SHELL="$(cygpath -m "$(command -v bash)")"
      - name: Test native Linux Rust Host
        if: runner.os == 'Linux'
        run: make test-rust RUST_TEST_ARGS="--release --target $TARGET"
      - name: Diagnose Windows loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $test = Get-ChildItem "$env:CARGO_TARGET_DIR/$env:TARGET/release/deps/gams_lib-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$test) { throw 'Compiled test executable not found' }
          New-Item -ItemType Directory -Force build.nosync/windows-loader | Out-Null
          Copy-Item $test.FullName build.nosync/windows-loader/
          & dumpbin.exe /imports $test.FullName | Out-File build.nosync/windows-loader/imports.txt
          & mt.exe "-inputresource:$($test.FullName);#1" -out:build.nosync/windows-loader/manifest.xml
          Write-Output "[DEBUG-v3-win] MANIFEST-EXTRACTION-EXIT $LASTEXITCODE"
          python scripts/diagnose-windows-imports.py $test.FullName
          foreach ($name in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $path = Join-Path "$env:SystemRoot/System32" $name
            if (Test-Path -LiteralPath $path) {
              $file = Get-Item -LiteralPath $path
              Write-Output "[DEBUG-v3-win] VERSION $($file.FullName) $($file.VersionInfo.FileVersion)"
            } else {
              Write-Output "[DEBUG-v3-win] MISSING-FILE $path"
            }
          }
      - name: Save Windows loader evidence
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-loader-failure
          path: build.nosync/windows-loader/
          if-no-files-found: warn
